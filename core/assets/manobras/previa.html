<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manobras — prévia dos sprites</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#171321;color:#fff8ec}
*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1120px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h1{font-size:30px;margin:0 0 8px}p{color:#c7bcd6;margin:0;line-height:1.5}
.tag{font-size:12px;letter-spacing:.12em;color:#ffd92e;font-weight:700;margin-bottom:12px}
main{display:grid;grid-template-columns:280px 1fr;gap:24px}
.controls,.stage{background:#241d32;border:1px solid #45384f;border-radius:18px;padding:24px}
label{display:block;font-size:13px;color:#d8cee1;margin:0 0 8px}select{width:100%;background:#171321;color:#fff8ec;border:1px solid #5a4868;border-radius:8px;padding:11px;margin-bottom:20px;font:inherit}
input[type=range]{width:100%;accent-color:#ffd92e}
.canvas-wrap{height:380px;border-radius:12px;overflow:hidden;background-color:#30263c;background-image:linear-gradient(45deg,#3b3047 25%,transparent 25%),linear-gradient(-45deg,#3b3047 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3b3047 75%),linear-gradient(-45deg,transparent 75%,#3b3047 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
canvas{width:100%;height:100%;display:block}
.transport{display:flex;align-items:center;gap:10px;margin:18px 0}
button{background:#ffd92e;color:#241d32;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:#45384f;color:#fff8ec}
#frame-count{margin-left:auto;color:#c7bcd6;font-variant-numeric:tabular-nums;font-size:13px}
a{color:#ffd92e;text-underline-offset:4px}.links{display:flex;gap:20px;margin-top:20px;font-size:13px}
#details{font-size:13px;min-height:44px;margin-top:16px}
#error{color:#ff8b91;white-space:pre-wrap}
@media(max-width:720px){body{padding:18px}header{display:block}main{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.canvas-wrap{height:340px}}
</style></head>
<body>
<header><div><div class="tag">ROLÊ × ROBÔS · PERSONAGEM CARTOON</div><h1>Manobras em movimento</h1><p>16 manobras · 14 folhas · 344 poses</p></div><a href="README.md">Guia dos assets</a></header>
<main>
<section class="controls" aria-label="Controles da prévia">
<div><label for="action">Manobra</label><select id="action"></select></div>
<div><label for="direction">Direção de deslocamento</label><select id="direction"><option value="SE">SE ↘</option><option value="SW">SW ↙</option><option value="NW">NW ↖</option><option value="NE">NE ↗</option></select></div>
<div><label for="spin">Sentido do giro</label><select id="spin"><option value="horario">Horário</option><option value="antihorario">Anti-horário</option></select></div>
<div><label for="stance">Postura inicial</label><select id="stance"><option value="normal">Normal</option><option value="fakie">Fakie</option></select></div>
<div><label for="speed">Velocidade da prévia: <span id="speed-label">0,6×</span></label><input id="speed" type="range" min="0.2" max="1.5" step="0.1" value="0.6"></div>
</section>
<section class="stage" aria-label="Animação">
<div class="canvas-wrap"><canvas id="canvas" width="720" height="420" aria-label="Prévia animada da manobra selecionada"></canvas></div>
<div class="transport"><button id="play" type="button">Pausar</button><button class="secondary" id="next" type="button">Próximo quadro</button><span id="frame-count"></span></div>
<label for="scrub">Quadro da animação</label><input id="scrub" type="range" min="0" max="1" value="0">
<p id="details"></p><p id="error" role="alert"></p>
<div class="links"><a id="atlas-link" href="kickflip_ciclo.png" target="_blank">Abrir folha atual</a><a href="manifest.json">Mapa de quadros</a></div>
</section>
</main>
<script src="manifest.js"></script><script src="previa.js"></script>
</body></html>
